<!DOCTYPE html>
<html>
<head>
    <title>MINIMAL SCROLL TEST</title>
    <style>
        body { margin: 0; padding: 0; }

        .container {
            width: 100vw;
            height: 100vh;
            background: black;
            color: white;
            overflow-y: scroll;
        }

        .content {
            padding: 20px;
        }

        .box {
            background: green;
            margin: 10px 0;
            padding: 20px;
            border: 2px solid yellow;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <h1>IF YOU CAN SCROLL THIS, SCROLLING WORKS!</h1>
            <h2>Use your mouse wheel or drag the scrollbar on the right →→→</h2>

            <div class="box">Box 1 - SCROLL DOWN TO SEE MORE</div>
            <div class="box">Box 2</div>
            <div class="box">Box 3</div>
            <div class="box">Box 4</div>
            <div class="box">Box 5</div>
            <div class="box">Box 6</div>
            <div class="box">Box 7</div>
            <div class="box">Box 8</div>
            <div class="box">Box 9</div>
            <div class="box">Box 10</div>
            <div class="box">Box 11</div>
            <div class="box">Box 12</div>
            <div class="box">Box 13</div>
            <div class="box">Box 14</div>
            <div class="box">Box 15</div>
            <div class="box">Box 16</div>
            <div class="box">Box 17</div>
            <div class="box">Box 18</div>
            <div class="box">Box 19</div>
            <div class="box">Box 20 - YOU SCROLLED! IT WORKS!</div>
        </div>
    </div>
</body>
</html>
